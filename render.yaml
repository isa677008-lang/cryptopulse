services:
  - type: web
    name: cryptopulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENABLE_BACKGROUND_WORKER
        value: "false"
      - key: TELEGRAM_AUTO_CONFIGURE
        value: "false"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
