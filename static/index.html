<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>CryptoPulse</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#24324a;--muted:#91a2bb;--text:#f3f6fb;--accent:#58d6a3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172744,var(--bg) 55%);font-family:system-ui,sans-serif;color:var(--text);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:28px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:1.45rem;font-weight:800}.brand span{color:var(--accent)}.sub,.label,.symbol,th,.footer{color:var(--muted)}.sub{margin-top:5px}button{border:1px solid #36506e;background:#1b2b43;color:var(--text);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.label,th{font-size:.82rem}.value{font-size:1.15rem;font-weight:750;margin-top:8px}.notice{padding:12px 14px;border-radius:12px;background:#15243a;color:#bfd0e6;margin:14px 0;line-height:1.5}.error{background:#3b1b26;color:#ffd4dc}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}th{font-weight:600}tbody tr:last-child td{border-bottom:0}.coin,.price{font-weight:700}.symbol{font-size:.82rem;margin-left:8px}.price{font-variant-numeric:tabular-nums}.positive{color:#62e6ad}.negative{color:#ff8294}.footer{font-size:.82rem;margin-top:16px}@media(max-width:600px){.summary{grid-template-columns:1fr}.wrap{padding-top:20px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">Crypto<span>Pulse</span></div><div class="sub">Котировки криптовалют*</div></div><button id="refresh">↻ Обновить</button></header>
<section class="summary"><div class="card"><div class="label">Монет загружено</div><div class="value" id="count">—</div></div><div class="card"><div class="label">Источник данных</div><div class="value" id="source">Загрузка…</div></div><div class="card"><div class="label">Обновлено</div><div class="value" id="updated">—</div></div></section>
<div id="notice" class="notice">Загружаем котировки…</div><div class="tablebox"><table><thead><tr><th>Актив</th><th>Цена, USD</th><th>Изменение за 24 ч.</th></tr></thead><tbody id="prices"><tr><td colspan="3">Загрузка…</td></tr></tbody></table></div>
<div class="footer">*Публичные API могут временно ограничивать запросы. Данные не являются инвестиционной рекомендацией.</div></main>
<script>
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n<1?6:2}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){let b=$('refresh');b.disabled=true;b.textContent='Загрузка…';try{let r=await fetch('/api/prices',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok||!Array.isArray(d.prices)||!d.prices.length)throw Error(d.error||'Поставщик не вернул цены');$('prices').innerHTML=d.prices.map(c=>{let v=Number(c.change24h)||0;return `<tr><td><span class="coin">${esc(c.name)}</span><span class="symbol">${esc(c.symbol)}</span></td><td class="price">${money(Number(c.price))}</td><td class="${v>=0?'positive':'negative'}">${v>0?'+':''}${v.toFixed(2)}%</td></tr>`}).join('');$('count').textContent=d.count||d.prices.length;$('source').textContent=esc(d.source||'API');$('updated').textContent=new Date(d.updatedAt||Date.now()).toLocaleTimeString('ru-RU');$('notice').className='notice'+(d.stale?' error':'');$('notice').textContent=d.stale?(d.warning||'Последние доступные данные'): 'Котировки успешно загружены.'}catch(e){$('notice').className='notice error';$('notice').textContent='Не удалось загрузить котировки: '+e.message+'. Попробуйте позже.';$('prices').innerHTML='<tr><td colspan="3">Временно нет данных.</td></tr>';$('source').textContent='Недоступен';$('count').textContent='0'}finally{b.disabled=false;b.textContent='↻ Обновить'}}
$('refresh').addEventListener('click',load);load();setInterval(load,60000);
</script></body></html>
