<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>CryptoPulse — крипторынок</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f1f5f9;
    }
    header {
      padding: 24px 16px;
      background: #111a2e;
      border-bottom: 1px solid #263249;
    }
    .container { max-width: 1000px; margin: auto; padding: 20px 16px; }
    h1 { margin: 0 0 8px; color: #67e8f9; }
    .muted { color: #94a3b8; }
    .status { margin-top: 14px; font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    .card {
      padding: 18px;
      border: 1px solid #263249;
      border-radius: 14px;
      background: #111a2e;
    }
    .symbol { font-weight: bold; font-size: 18px; }
    .price { font-size: 24px; margin: 12px 0; overflow-wrap: anywhere; }
    .change { font-size: 14px; }
    .positive { color: #4ade80; }
    .negative { color: #fb7185; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      background: #0891b2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>CryptoPulse</h1>
      <div class="muted">Криптовалюты и движение рынка</div>
      <div class="status" id="status">Загрузка данных...</div>
    </div>
  </header>

  <main class="container">
    <button id="refresh">Обновить цены</button>
    <div class="grid" id="coins"></div>
  </main>

  <script>
    const statusElement = document.getElementById("status");
    const coinsElement = document.getElementById("coins");
    const refreshButton = document.getElementById("refresh");

    function formatPrice(value) {
      if (typeof value !== "number" || !Number.isFinite(value)) {
        return "Нет данных";
      }

      return new Intl.NumberFormat("ru-RU", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: value < 1 ? 6 : 2
      }).format(value);
    }

    function formatChange(value) {
      if (typeof value !== "number" || !Number.isFinite(value)) {
        return "Нет данных";
      }

      return `${value > 0 ? "+" : ""}${value.toFixed(2)}%`;
    }

    async function loadPrices() {
      refreshButton.disabled = true;
      statusElement.textContent = "Получаем актуальные цены...";

      try {
        const response = await fetch("/api/prices", {
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error("Сервер вернул ошибку");
        }

        const data = await response.json();

        if (!data || !data.prices) {
          throw new Error("Неверный формат данных");
        }

        coinsElement.replaceChildren();

        for (const [symbol, price] of Object.entries(data.prices)) {
          const change = data.changes24h
            ? data.changes24h[symbol]
            : null;

          const card = document.createElement("article");
          card.className = "card";

          const name = document.createElement("div");
          name.className = "symbol";
          name.textContent = symbol;

          const priceElement = document.createElement("div");
          priceElement.className = "price";
          priceElement.textContent = formatPrice(price);

          const changeElement = document.createElement("div");
          changeElement.className = "change";

          if (typeof change === "number" && Number.isFinite(change)) {
            changeElement.classList.add(
              change >= 0 ? "positive" : "negative"
            );
          }

          changeElement.textContent =
            `Изменение за 24 часа: ${formatChange(change)}`;

          card.append(name, priceElement, changeElement);
          coinsElement.appendChild(card);
        }

        const updated = data.updated_at
          ? new Date(data.updated_at * 1000).toLocaleTimeString("ru-RU")
          : new Date().toLocaleTimeString("ru-RU");

        statusElement.textContent =
          `Обновлено: ${updated} · Источник: ${data.source || "API"}`;
      } catch (error) {
        statusElement.textContent =
          "Не удалось загрузить цены. Попробуйте ещё раз позже.";
        console.error(error);
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadPrices);

    loadPrices();
    setInterval(loadPrices, 30000);
  </script>
</body>
</html>
